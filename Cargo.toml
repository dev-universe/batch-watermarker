[package]
name = "batch-watermarker"
version = "2.0.0"
edition = "2024"
rust-version = "1.92"
description = "Native Rust PDF and image watermark workbench"
license = "ISC"
repository = "https://github.com/dev-universe/batch-watermarker"
default-run = "batch-watermarker"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
eframe = { version = "0.33.3", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }
flate2 = { version = "1.1", default-features = false, features = ["rust_backend"] }
hayro = "0.9.0"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp", "tiff"] }
jpeg-encoder = "0.7.1"
kamadak-exif = "0.6"
lopdf = { version = "0.47.0", default-features = false }
natord = "1.0"
png = "0.18"
resvg = "0.49"
rfd = "0.17.2"
roxmltree = "0.21"
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = "1.0"
tempfile = "3.23"
tiff = "0.11"

[dev-dependencies]
sha2 = "0.10"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"

[[bin]]
name = "batch-watermarker"
path = "src/main.rs"

[[bin]]
name = "watermark-cli"
path = "src/cli.rs"

[build-dependencies]
winresource = "0.1.34"

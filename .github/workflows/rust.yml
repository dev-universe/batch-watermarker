name: Rust validation and packages
on:
  pull_request:
  push:
    branches: [main, 'codex/rust-*']
    tags: ['v2.*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-15, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev libxcb-shape0-dev libxcb-xfixes0-dev libegl1-mesa-dev
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked --all-targets
  package:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: macos-15
            target: aarch64-apple-darwin
          - os: macos-15
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - run: cargo build --release --locked --bins --target ${{ matrix.target }}
      - if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install nsis -y --no-progress
          ./scripts/package-windows.ps1 -Target '${{ matrix.target }}'
      - if: runner.os == 'macOS'
        run: bash scripts/package-macos.sh '${{ matrix.target }}'
      - name: Verify installed Windows CLI
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installer = (Get-ChildItem release/rust/*-setup.exe).FullName
          $installDir = Join-Path $env:RUNNER_TEMP 'watermarker-install'
          $setup = Start-Process -FilePath $installer -ArgumentList '/S', "/D=$installDir" -Wait -PassThru -WindowStyle Hidden
          if ($setup.ExitCode -ne 0) { throw 'Installer failed.' }
          $version = (Select-String Cargo.toml -Pattern '^version = "([^"]+)"').Matches[0].Groups[1].Value
          $actual = & (Join-Path $installDir 'watermark-cli.exe') --version
          if ($LASTEXITCODE -ne 0 -or $actual -ne "batch-watermarker $version") { throw 'Installed CLI version mismatch.' }
      - uses: actions/upload-artifact@v4
        with:
          name: packages-${{ matrix.target }}
          path: release/rust/*
          if-no-files-found: error
          retention-days: 14
  verify_packages:
    needs: package
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: packages-*
          path: release/rust
          merge-multiple: true
      - name: Verify checksums across platforms
        working-directory: release/rust
        run: sha256sum --check *.sha256
  publish:
    if: startsWith(github.ref, 'refs/tags/v2.')
    needs: verify_packages
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: packages-*
          path: release/rust
          merge-multiple: true
      - name: Verify package checksums
        working-directory: release/rust
        run: sha256sum --check *.sha256
      - name: Publish verified release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release/rust/* --verify-tag --title "Batch Watermarker ${GITHUB_REF_NAME#v}" --notes-file docs/release-2.0.0.md
